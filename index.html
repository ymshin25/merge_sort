<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>병합 정렬 코드 완전 해설</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D1117;--surf:#161B22;--surf2:#1C2330;--brd:#30363D;
  --pur:#7C3AED;--pur-l:#A78BFA;--pur-bg:rgba(124,58,237,.18);
  --teal:#0D9488;--teal-l:#5EEAD4;
  --amb:#D97706;--amb-l:#FCD34D;
  --red:#DC2626;--red-l:#FCA5A5;
  --grn:#16A34A;--grn-l:#86EFAC;
  --blu:#1D4ED8;--blu-l:#93C5FD;
  --txt:#E6EDF3;--txt-m:#8B949E;--txt-d:#484F58;
  --code:'JetBrains Mono',monospace;
  --body:'Noto Sans KR',sans-serif;
}
body{background:var(--bg);color:var(--txt);font-family:var(--body);overflow-x:hidden}

/* ── 헤더 ── */
.hero{padding:2rem 1.5rem 1.5rem;text-align:center;border-bottom:1px solid var(--brd)}
.hero-chip{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--pur-l);background:rgba(124,58,237,.15);border:1px solid rgba(124,58,237,.3);border-radius:20px;padding:3px 12px;margin-bottom:.75rem}
.hero h1{font-size:1.6rem;font-weight:700;margin-bottom:.35rem}
.hero p{font-size:.83rem;color:var(--txt-m);max-width:480px;margin:0 auto}

/* ── 네비게이션 바 ── */
.nav-bar{position:sticky;top:0;z-index:100;background:rgba(13,17,23,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--brd);padding:.6rem 1.5rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.step-btn{font-family:var(--body);font-size:12px;padding:5px 12px;border-radius:6px;border:1px solid var(--brd);background:var(--surf);color:var(--txt-m);cursor:pointer;transition:all .15s;white-space:nowrap}
.step-btn:hover{background:var(--surf2);color:var(--txt);border-color:var(--pur)}
.step-btn.primary{background:var(--pur);color:#fff;border-color:var(--pur)}
.step-btn.primary:hover{background:#6D28D9}
.step-info{font-size:11px;color:var(--txt-d);font-family:var(--code);margin-left:auto}
.prog-wrap{width:100%;height:2px;background:var(--brd);border-radius:1px;overflow:hidden;order:99}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--pur),var(--teal));border-radius:1px;transition:width .3s}

/* ── 본문 좌우 분할 ── */
.main-layout{display:grid;grid-template-columns:420px 1fr;height:calc(100vh - 108px);overflow:hidden}
@media(max-width:800px){.main-layout{grid-template-columns:1fr;height:auto;overflow:visible}}
.left-pane{border-right:1px solid var(--brd);overflow-y:auto;overflow-x:hidden;background:var(--surf);display:flex;flex-direction:column}
.left-pane-hdr{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:6px;padding:.55rem 1rem;border-bottom:1px solid var(--brd);font-size:10px;color:var(--txt-m);font-weight:600;letter-spacing:.06em;background:var(--surf);flex-shrink:0}
.right-pane{overflow-y:auto;overflow-x:hidden;background:var(--bg)}
.right-pane-inner{padding:1.25rem 1.25rem 2rem}

/* ── 본문 좌우 분할 ── */
.main-layout{display:grid;grid-template-columns:420px 1fr;height:calc(100vh - 108px);overflow:hidden}
@media(max-width:800px){.main-layout{grid-template-columns:1fr;height:auto;overflow:visible}}
.left-pane{border-right:1px solid var(--brd);overflow-y:auto;overflow-x:hidden;background:var(--surf);display:flex;flex-direction:column}
.left-pane-hdr{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:6px;padding:.55rem 1rem;border-bottom:1px solid var(--brd);font-size:10px;color:var(--txt-m);font-weight:600;letter-spacing:.06em;background:var(--surf);flex-shrink:0}
.right-pane{overflow-y:auto;overflow-x:hidden;background:var(--bg)}
.right-pane-inner{padding:1.25rem 1.25rem 2rem}

/* ── 단계 제목 ── */
.step-title{display:flex;align-items:center;gap:10px;margin-bottom:1rem}
.step-title .badge{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:12px}
.step-title h2{font-size:1rem;font-weight:700;color:var(--txt);line-height:1.3}

/* ── 코드 블록 ── */
.code-card{background:var(--surf);border:1px solid var(--brd);border-radius:10px;overflow:hidden}
.code-card-hdr{display:flex;align-items:center;gap:6px;padding:.55rem 1rem;border-bottom:1px solid var(--brd);font-size:10px;color:var(--txt-m);font-weight:600;letter-spacing:.06em}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.code-body{padding:.75rem 0;overflow-x:auto;font-family:var(--code);font-size:12px;line-height:1.9}
.cl{display:flex;align-items:stretch;border-left:3px solid transparent;min-height:24px}
.cl.hi{background:var(--pur-bg);border-left-color:var(--pur)}
.ln{min-width:38px;padding:0 10px 0 6px;text-align:right;color:var(--txt-d);font-size:10px;user-select:none;display:flex;align-items:center;justify-content:flex-end;flex-shrink:0}
.cl.hi .ln{color:var(--pur-l)}
.ct{padding:0 14px 0 2px;white-space:pre;color:var(--txt)}
.ct.cm{color:#4A5568;font-style:italic}
.sep{height:6px}
.kw{color:#C792EA}.fn{color:#82AAFF}.st{color:#C3E88D}
.num{color:#F78C6C}.op{color:#89DDFF}.pu{color:#89DDFF}
.dc{color:#3B5249;font-style:italic}
.cm-i{color:#4A5568;font-style:italic}

/* ── 설명 카드 ── */
.explain-card{background:var(--surf);border:1px solid var(--brd);border-radius:10px;overflow:hidden}
.ec-hdr{padding:.55rem 1rem;border-bottom:1px solid var(--brd);font-size:11px;font-weight:700;display:flex;align-items:center;gap:7px}
.ec-body{padding:.85rem 1rem;font-size:13px;line-height:1.8;color:var(--txt-m)}
.ec-body strong{color:var(--txt);font-weight:500}
.ec-body code{font-family:var(--code);font-size:11.5px;background:rgba(255,255,255,.07);padding:1px 6px;border-radius:4px;color:var(--amb-l)}
.ec-body .step-line{display:flex;gap:8px;align-items:flex-start;margin:.2rem 0;font-size:12.5px}
.ec-body .step-line .mark{flex-shrink:0;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;margin-top:1px}
.note{margin-top:.6rem;padding:.5rem .75rem;background:rgba(255,255,255,.04);border-left:2px solid var(--brd);border-radius:0 4px 4px 0;font-size:11.5px;color:var(--txt-d)}

/* ── 배열 시각화 ── */
.viz-card{background:var(--surf);border:1px solid var(--brd);border-radius:10px;padding:.9rem 1rem;margin-bottom:.85rem}
.viz-label{font-size:10px;color:var(--txt-m);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.6rem;display:flex;align-items:center;gap:6px}
.arr-row{display:flex;gap:5px;align-items:flex-end;flex-wrap:wrap}
.bar-w{display:flex;flex-direction:column;align-items:center;gap:3px}
.bar{border-radius:4px 4px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:3px;font-size:12px;font-weight:600;font-family:var(--code);transition:all .3s cubic-bezier(.4,0,.2,1);width:40px}
.bar-lbl{font-size:9px;color:var(--txt-d);font-family:var(--code)}
/* 색상 */
.c-def{background:rgba(124,58,237,.28);color:var(--pur-l);border:1px solid rgba(124,58,237,.45)}
.c-left{background:rgba(220,38,38,.28);color:var(--red-l);border:1px solid rgba(220,38,38,.45);transform:translateY(-6px)}
.c-right{background:rgba(29,78,216,.28);color:var(--blu-l);border:1px solid rgba(29,78,216,.45);transform:translateY(-6px)}
.c-active-l{background:rgba(220,38,38,.55);color:#fff;border:1px solid var(--red-l);transform:translateY(-10px)}
.c-active-r{background:rgba(29,78,216,.55);color:#fff;border:1px solid var(--blu-l);transform:translateY(-10px)}
.c-result{background:rgba(22,163,74,.28);color:var(--grn-l);border:1px solid rgba(22,163,74,.45)}
.c-done{background:rgba(13,148,136,.3);color:var(--teal-l);border:1px solid rgba(13,148,136,.5)}
.c-new{background:rgba(22,163,74,.5);color:#fff;border:1px solid var(--grn-l);transform:translateY(-5px)}

/* 포인터 화살표 */
.ptr{font-size:9px;font-weight:700;text-align:center;width:40px;font-family:var(--code)}

/* ── 재귀 트리 ── */
.tree-card{background:var(--surf);border:1px solid var(--brd);border-radius:10px;padding:.9rem 1rem;margin-bottom:.85rem;overflow-x:auto}
.tree-grid{display:flex;flex-direction:column;gap:2px}
.tree-lv{display:flex;align-items:center;gap:4px;padding-left:var(--indent,0px)}
.tn{font-family:var(--code);font-size:10.5px;padding:2px 8px;border-radius:4px;white-space:nowrap;border:1px solid}
.tn-root{background:rgba(124,58,237,.15);border-color:rgba(124,58,237,.4);color:var(--pur-l)}
.tn-left{background:rgba(220,38,38,.12);border-color:rgba(220,38,38,.35);color:var(--red-l)}
.tn-right{background:rgba(29,78,216,.12);border-color:rgba(29,78,216,.35);color:var(--blu-l)}
.tn-leaf{background:rgba(13,148,136,.12);border-color:rgba(13,148,136,.35);color:var(--teal-l)}
.tn-done{background:rgba(22,163,74,.18);border-color:rgba(22,163,74,.4);color:var(--grn-l);font-weight:600}
.tn-cur{outline:1.5px solid var(--amb);outline-offset:1px}
.t-arrow{font-size:9px;color:var(--txt-d)}

/* ── 변수표 ── */
.var-table{width:100%;border-collapse:collapse;font-family:var(--code);font-size:11.5px;margin-top:.5rem}
.var-table th{color:var(--txt-m);font-weight:600;font-size:10px;padding:4px 8px;border-bottom:1px solid var(--brd);text-align:left}
.var-table td{padding:4px 8px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
.var-table tr:last-child td{border-bottom:none}
.vv{color:var(--amb-l)}
.tag{display:inline-flex;align-items:center;font-size:9px;padding:1px 6px;border-radius:8px;font-weight:700;margin-left:4px;vertical-align:middle}
.tag-new{background:rgba(22,163,74,.25);color:var(--grn-l)}
.tag-chg{background:rgba(217,119,6,.25);color:var(--amb-l)}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-chip">정렬 알고리즘 ③</div>
  <h1>병합 정렬 코드 완전 해설</h1>
  <p>단계 버튼을 눌러 코드가 실행되면서 변수와 배열이 어떻게 변하는지 확인하세요</p>
</div>

<div class="nav-bar">
  <button class="step-btn" onclick="go(-1)">◀ 이전</button>
  <button class="step-btn primary" id="autoBtn" onclick="toggleAuto()">▶ 자동</button>
  <button class="step-btn" onclick="go(1)">다음 ▶</button>
  <button class="step-btn" onclick="reset()">↺ 처음</button>
  <span class="step-info" id="stepInfo">1 / 14</span>
  <div class="prog-wrap"><div class="prog-fill" id="pf" style="width:0%"></div></div>
</div>

<div class="main-layout">
  <div class="left-pane">
    <div class="left-pane-hdr">
      <div class="dot" style="background:#FF5F57"></div>
      <div class="dot" style="background:#FEBC2E"></div>
      <div class="dot" style="background:#28C840"></div>
      <span style="margin-left:4px">merge_sort.py</span>
    </div>
    <div id="codePane"></div>
  </div>
  <div class="right-pane">
    <div class="right-pane-inner">
      <div class="step-title" id="stepTitle"></div>
      <div id="explainPane"></div>
      <div id="vizPane"></div>
    </div>
  </div>
</div>

<script>
const MX=8;
function bh(v){return Math.max(Math.round((v/MX)*68),8)}

// 코드 라인 정의 (ln: 줄번호, code: HTML, grp: 그룹)
const LINES=[
  {ln:1,  code:'<span class="cm-i"># ────────────────────────────────────</span>'},
  {ln:2,  code:'<span class="cm-i"># 병합 정렬 (Merge Sort)</span>'},
  {ln:3,  code:'<span class="cm-i"># 배열: [8, 3, 1, 5, 2, 7]</span>'},
  {ln:4,  code:'<span class="cm-i"># ────────────────────────────────────</span>'},
  {ln:'', sep:true},
  {ln:5,  code:'<span class="kw">def </span><span class="fn">merge</span><span class="pu">(left, right):</span>'},
  {ln:6,  code:'    <span class="dc">"""정렬된 두 배열을 하나로 합치는 함수"""</span>'},
  {ln:7,  code:'    <span class="fn">result</span> <span class="op">=</span> <span class="pu">[];</span>  <span class="fn">i</span> <span class="op">=</span> <span class="fn">j</span> <span class="op">=</span> <span class="num">0</span>'},
  {ln:8,  code:'    <span class="cm-i"># 작은 쪽을 result에 추가</span>'},
  {ln:9,  code:'    <span class="kw">while</span> <span class="fn">i</span> <span class="op">&lt;</span> <span class="fn">len</span><span class="pu">(left)</span> <span class="kw">and</span> <span class="fn">j</span> <span class="op">&lt;</span> <span class="fn">len</span><span class="pu">(right):</span>'},
  {ln:10, code:'        <span class="kw">if</span> <span class="fn">left</span><span class="pu">[</span><span class="fn">i</span><span class="pu">]</span> <span class="op">&lt;=</span> <span class="fn">right</span><span class="pu">[</span><span class="fn">j</span><span class="pu">]:</span>'},
  {ln:11, code:'            <span class="fn">result</span><span class="pu">.</span><span class="fn">append</span><span class="pu">(</span><span class="fn">left</span><span class="pu">[</span><span class="fn">i</span><span class="pu">]);</span>  <span class="fn">i</span> <span class="op">+=</span> <span class="num">1</span>'},
  {ln:12, code:'        <span class="kw">else</span><span class="pu">:</span>'},
  {ln:13, code:'            <span class="fn">result</span><span class="pu">.</span><span class="fn">append</span><span class="pu">(</span><span class="fn">right</span><span class="pu">[</span><span class="fn">j</span><span class="pu">]);</span> <span class="fn">j</span> <span class="op">+=</span> <span class="num">1</span>'},
  {ln:14, code:'    <span class="cm-i"># 남은 원소 이어 붙임</span>'},
  {ln:15, code:'    <span class="fn">result</span> <span class="op">+=</span> <span class="fn">left</span><span class="pu">[</span><span class="fn">i</span><span class="pu">:]</span> <span class="op">+</span> <span class="fn">right</span><span class="pu">[</span><span class="fn">j</span><span class="pu">:]</span>'},
  {ln:16, code:'    <span class="kw">return</span> <span class="fn">result</span>'},
  {ln:'', sep:true},
  {ln:17, code:'<span class="kw">def </span><span class="fn">merge_sort</span><span class="pu">(arr):</span>'},
  {ln:18, code:'    <span class="dc">"""배열을 재귀적으로 분할하고 병합하는 함수"""</span>'},
  {ln:19, code:'    <span class="kw">if</span> <span class="fn">len</span><span class="pu">(arr)</span> <span class="op">&lt;=</span> <span class="num">1</span><span class="pu">:</span>'},
  {ln:20, code:'        <span class="kw">return</span> <span class="fn">arr</span>   <span class="cm-i"># 종료 조건: 1개는 이미 정렬됨</span>'},
  {ln:21, code:'    <span class="fn">mid</span> <span class="op">=</span> <span class="fn">len</span><span class="pu">(arr)</span> <span class="op">//</span> <span class="num">2</span>   <span class="cm-i"># 절반 위치</span>'},
  {ln:22, code:'    <span class="fn">left</span>  <span class="op">=</span> <span class="fn">merge_sort</span><span class="pu">(arr[:mid])</span>  <span class="cm-i"># 왼쪽 재귀</span>'},
  {ln:23, code:'    <span class="fn">right</span> <span class="op">=</span> <span class="fn">merge_sort</span><span class="pu">(arr[mid:])</span>  <span class="cm-i"># 오른쪽 재귀</span>'},
  {ln:24, code:'    <span class="kw">return</span> <span class="fn">merge</span><span class="pu">(left, right)</span>    <span class="cm-i"># 병합!</span>'},
  {ln:'', sep:true},
  {ln:25, code:'<span class="fn">arr</span> <span class="op">=</span> <span class="pu">[</span><span class="num">8</span><span class="pu">,</span><span class="num">3</span><span class="pu">,</span><span class="num">1</span><span class="pu">,</span><span class="num">5</span><span class="pu">,</span><span class="num">2</span><span class="pu">,</span><span class="num">7</span><span class="pu">]</span>'},
  {ln:26, code:'<span class="fn">print</span><span class="pu">(</span><span class="fn">merge_sort</span><span class="pu">(arr))</span>'},
  {ln:27, code:'<span class="cm-i"># 출력: [1, 2, 3, 5, 7, 8]</span>'},
];

function bars(arr,clsArr,ptrs){
  // arr: 값 배열, clsArr: 각 원소 색상 클래스, ptrs: {i:idx,j:idx}
  return arr.map((v,k)=>{
    const pL=ptrs&&ptrs.i===k?`<div class="ptr" style="color:#FCA5A5">↑i</div>`:'';
    const pR=ptrs&&ptrs.j===k?`<div class="ptr" style="color:#93C5FD">↑j</div>`:'';
    const ptr=pL||pR||'';
    return `<div class="bar-w">${ptr}<div class="bar ${clsArr?clsArr[k]:'c-def'}" style="height:${bh(v)}px">${v}</div><div class="bar-lbl">[${k}]</div></div>`;
  }).join('');
}

// ── 검증된 14개 단계 ──────────────────────────────────────────────
const STEPS=[

/* 0 */ {
  hlLines:[25],
  color:'#7C3AED', label:'01', title:'초기 배열 설정',
  explain:{
    hdr:'arr = [8, 3, 1, 5, 2, 7]',
    items:[
      {c:'#A78BFA',t:'<code>arr = [8, 3, 1, 5, 2, 7]</code> — 정렬할 배열을 메모리에 저장합니다.'},
      {c:'#A78BFA',t:'총 <strong>6개</strong> 원소, 인덱스는 0~5입니다.'},
      {c:'#A78BFA',t:'이제 <code>print(merge_sort(arr))</code>를 호출합니다.'},
    ],
    note:'파이썬에서 리스트(list)는 대괄호 []로 만들고, 각 원소는 인덱스 0부터 접근합니다.'
  },
  tree:[{txt:'merge_sort([8,3,1,5,2,7])',cls:'tn-root tn-cur',indent:0}],
  viz:[{lbl:'arr — 초기 배열',arr:[8,3,1,5,2,7],cls:['c-def','c-def','c-def','c-def','c-def','c-def']}],
  vars:[{n:'arr',v:'[8, 3, 1, 5, 2, 7]',t:'new'}],
},

/* 1 */ {
  hlLines:[26,17,18,19],
  color:'#7C3AED', label:'02', title:'merge_sort() 첫 호출 & 종료조건 확인',
  explain:{
    hdr:'merge_sort([8,3,1,5,2,7]) 시작',
    items:[
      {c:'#A78BFA',t:'<code>len(arr) = 6</code>,  6 ≤ 1은 <strong>False</strong> → 계속 진행'},
      {c:'#A78BFA',t:'원소가 2개 이상이므로 분할을 시작합니다.'},
    ],
    note:'종료 조건(len ≤ 1)은 재귀가 무한히 반복되지 않도록 막아주는 안전장치입니다.'
  },
  tree:[{txt:'merge_sort([8,3,1,5,2,7])',cls:'tn-root tn-cur',indent:0}],
  viz:[{lbl:'arr (함수 파라미터)',arr:[8,3,1,5,2,7],cls:['c-def','c-def','c-def','c-def','c-def','c-def']}],
  vars:[{n:'arr',v:'[8, 3, 1, 5, 2, 7]'},{n:'len(arr)',v:'6'},{n:'6 ≤ 1?',v:'False → 계속!',t:'chg'}],
},

/* 2 */ {
  hlLines:[21,22,23],
  color:'#DC2626', label:'03', title:'mid 계산 & 왼쪽·오른쪽 분할',
  explain:{
    hdr:'mid = 6 // 2 = 3  →  절반으로 나누기',

    const active=hls&&hls.includes(l.ln);

  });
  document.getElementById('codePane').innerHTML=
    `<div class="code-body" style="padding:.75rem 0;font-family:var(--code);font-size:12px;line-height:1.9">${h}</div>`;
}

function renderExplain(s){
  const e=s.explain;
  const items=e.items.map(it=>`<div class="step-line"><div class="mark" style="background:${it.c}22;color:${it.c};border:1px solid ${it.c}55">▸</div><div>${it.t}</div></div>`).join('');
  document.getElementById('explainPane').innerHTML=
    `<div class="explain-card"><div class="ec-hdr" style="color:${s.color}"><svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="${s.color}44" stroke="${s.color}" stroke-width="1.5"/><circle cx="5" cy="5" r="1.8" fill="${s.color}"/></svg> 단계 ${s.label} — ${s.title}</div><div class="ec-body">${items}<div class="note">${e.note}</div></div></div>`;
}

function renderViz(s){
  // 재귀 트리
  let treeH=`<div class="tree-card"><div class="viz-label"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1v4M6 5l-3 3M6 5l3 3" stroke="var(--pur-l)" stroke-width="1.5" stroke-linecap="round"/></svg>재귀 호출 트리</div><div class="tree-grid">`;
  s.tree.forEach(n=>{
    treeH+=`<div class="tree-lv" style="--indent:${n.indent}px"><div class="tn ${n.cls}">${n.txt}</div></div>`;
  });
  treeH+=`</div></div>`;

  // 배열 시각화
  let vizH='';
  s.viz.forEach(v=>{
    const cellsH=v.arr.map((val,k)=>{
      const pL=v.ptrs&&v.ptrs.i===k?`<div class="ptr" style="color:#FCA5A5">↑i</div>`:'';
      const pR=v.ptrs&&v.ptrs.j===k?`<div class="ptr" style="color:#93C5FD">↑j</div>`:'';
      return `<div class="bar-w">${pL||pR||''}<div class="bar ${v.cls?v.cls[k]:'c-def'}" style="height:${bh(val)}px">${val}</div><div class="bar-lbl">[${k}]</div></div>`;
    }).join('');
    vizH+=`<div class="viz-card"><div class="viz-label">${v.lbl}</div><div class="arr-row">${cellsH}</div></div>`;
  });

  // 변수표
  let varH=`<div class="viz-card"><div class="viz-label">변수 추적</div><table class="var-table"><thead><tr><th>변수</th><th>값</th></tr></thead><tbody>`;
  s.vars.forEach(v=>{
    const tag=v.t?`<span class="tag ${v.t==='new'?'tag-new':'tag-chg'}">${v.t==='new'?'생성':'갱신'}</span>`:'';
    varH+=`<tr><td>${v.n}</td><td class="vv">${v.v}${tag}</td></tr>`;
  });
  varH+=`</tbody></table></div>`;

  document.getElementById('vizPane').innerHTML=treeH+vizH+varH;
}

function renderStep(){
  const s=STEPS[cur];
  const pct=Math.round(((cur+1)/STEPS.length)*100);
  document.getElementById('pf').style.width=pct+'%';
  document.getElementById('stepInfo').textContent=`${cur+1} / ${STEPS.length}`;
  document.getElementById('stepTitle').innerHTML=
    `<span class="badge" style="background:${s.color}22;color:${s.color};border:1px solid ${s.color}55">단계 ${s.label}</span><h2>${s.title}</h2>`;
  renderCode(s.hlLines);
  renderExplain(s);
  renderViz(s);
}

function go(d){
  const n=cur+d;
  if(n<0||n>=STEPS.length)return;
  cur=n; renderStep();
}
function reset(){cur=0;stopAuto();renderStep();}
function stopAuto(){if(timer){clearInterval(timer);timer=null;}document.getElementById('autoBtn').textContent='▶ 자동';}
function toggleAuto(){
  if(timer){stopAuto();return;}
  document.getElementById('autoBtn').textContent='⏸ 정지';
  timer=setInterval(()=>{if(cur>=STEPS.length-1){stopAuto();return;}cur++;renderStep();},2000);
}

renderStep();
</script>
</body>
</html>
